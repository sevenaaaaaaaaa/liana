[package]
name = "liana-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "松萝会话编排：模式切换、选词提交、学习重排"

[dependencies]
liana-core = { workspace = true }
liana-dict = { workspace = true }
liana-pinyin = { workspace = true }
liana-en = { workspace = true }
liana-ja = { workspace = true }
liana-emoji = { workspace = true }
liana-symbol = { workspace = true }
liana-radix = { workspace = true }
liana-zhconv = { workspace = true }

# 神经重排器（精准度专项 P1，可选特性）：内核默认零第三方依赖，
# 只有启用 rerank 特性（FFI/xtask 构建）才引入 chinese-ime-lm。
chinese-ime-lm = { version = "0.2", optional = true }

[features]
rerank = ["dep:chinese-ime-lm"]
