[package]
name = "liana-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Liana C ABI：供 macOS/Windows/Linux/Android/iOS/HarmonyOS 前端调用"

[lib]
name = "liana_ffi"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["rerank"]
rerank = ["liana-engine/rerank"]

[dependencies]
liana-core = { workspace = true }
liana-dict = { workspace = true }
liana-engine = { workspace = true }
liana-ai = { workspace = true }
liana-plugin = { workspace = true }
