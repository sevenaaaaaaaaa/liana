name: Liana
options:
  bundleIdPrefix: dev.liana
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

targets:
  LianaApp:
    type: application
    platform: iOS
    sources:
      - Host
      - Shared
      - path: ../apple/PetLinkTransport.swift
      - path: ../apple/PetLinkSender.swift
    dependencies:
      - target: LianaKeyboard
        embed: true
    info:
      path: Host/Info.plist
      properties:
        CFBundleDisplayName: 松萝输入法
        NSBluetoothAlwaysUsageDescription: 连接你选择的 BLE 语音或编码设备，接收设备识别的文字。
        NSMicrophoneUsageDescription: 仅在你于松萝主 App 点击开始语音识别时录音；音频只在本机转换为文字，不上传。
        NSSpeechRecognitionUsageDescription: 在本机识别中文、英语、日语、韩语、俄语、法语、西班牙语语音，并把原文或本机译文复制回键盘；不使用云端识别。
        NSCameraUsageDescription: 扫描你 Mac 桌宠显示的二维码，完成本地文件传输配对。
        NSLocalNetworkUsageDescription: 在同一局域网发现并连接你配对的 Mac，将你选择的文件发送给桌宠。
        NSBonjourServices: ["_liana-pet._tcp"]
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: 发送文件给 Mac 桌宠
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: ["public.item"]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneClassName: UIWindowScene
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.liana.ime.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.9.1
        CURRENT_PROJECT_VERSION: 9
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: "NO"

  LianaKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - path: ../apple/PetLinkTransport.swift
      - path: ../apple/PetLinkSender.swift
      - Shared
      - path: Resources/base.ifd
        buildPhase: resources
      - path: Resources/mobile.sqlite
        buildPhase: resources
      - path: Vendor/Wubi86/LICENSE-Wubi.txt
        buildPhase: resources
      - path: Vendor/Handwriting
        excludes: [SOURCE.json, Source]
        buildPhase: resources
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: 松萝键盘
        NSLocalNetworkUsageDescription: 仅在你主动同步剪贴板时，连接已配对 Mac。
        NSBonjourServices: ["_liana-pet._tcp"]
        NSBluetoothAlwaysUsageDescription: 仅在你点击扫描或连接时访问蓝牙，接收所选 BLE 设备的文字。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.liana.ime.ios.keyboard
        MARKETING_VERSION: 0.9.1
        CURRENT_PROJECT_VERSION: 9
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_OBJC_BRIDGING_HEADER: Keyboard/bridge.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../../crates/ffi/include"
        # 真机/模拟器两份静态库，按 SDK 自动选择
        OTHER_LDFLAGS: "$(SRCROOT)/libs/libliana_ffi_device.a"
        OTHER_LDFLAGS[sdk=iphonesimulator*]: "$(SRCROOT)/libs/libliana_ffi_sim.a"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: "NO"


  LianaKeyboardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Keyboard
      - Shared
      - path: Tests/KeyboardBehaviorTests.swift
      - path: Tests/VocabularyDiagnosticsTests.swift
      - path: Host/LianaGuideViewController.swift
      - path: Host/MobileToolsViewController.swift
      - path: Host/VoiceMeterView.swift
      - path: Host/LocalVoiceSession.swift
      - path: Host/VoiceLanguage.swift
      - path: Host/VoiceTranscript.swift
      - path: Host/VoiceTranslation.swift
      - path: Host/VoiceLogicTests.swift
      - path: Host/MobilePhraseBook.swift
      - path: Host/ViewController.swift
      - path: Host/PetLinkViewController.swift
      - path: Host/PairingScannerViewController.swift
      - path: ../apple/PetLinkTransport.swift
      - path: ../apple/PetLinkSender.swift
      - path: Resources/base.ifd
        buildPhase: resources
      - path: Resources/mobile.sqlite
        buildPhase: resources
      - path: Vendor/Wubi86/LICENSE-Wubi.txt
        buildPhase: resources
      - path: Vendor/Handwriting
        excludes: [SOURCE.json, Source]
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.liana.ime.ios.tests
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Keyboard/bridge.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../../crates/ffi/include"
        OTHER_LDFLAGS: "$(SRCROOT)/libs/libliana_ffi_device.a"
        OTHER_LDFLAGS[sdk=iphonesimulator*]: "$(SRCROOT)/libs/libliana_ffi_sim.a"
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES

  LianaAppLaunchTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/AppLaunchTests.swift
    dependencies:
      - target: LianaApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.liana.ime.ios.launchtests
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: LianaApp
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LianaApp:
    build:
      targets:
        LianaApp: [run, test, profile, analyze, archive]
  LianaAppLaunchTests:
    build:
      targets:
        LianaApp: [run, test]
        LianaAppLaunchTests: [test]
    test:
      targets:
        - LianaAppLaunchTests
  LianaKeyboardTests:
    build:
      targets:
        LianaKeyboardTests: [test]
    test:
      targets:
        - LianaKeyboardTests
