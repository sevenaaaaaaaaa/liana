# 松萝发布工作流：tag 推送（v*）时三端构建并挂到 GitHub Release。
#
# 各端口径（与本地 dist.sh 一致，绝不假装可分发）：
#   macOS   platforms/macos/dist.sh —— CI 无证书自动降级 ad-hoc、跳过公证；
#           产物未公证，Release 说明附 Gatekeeper 放行步骤
#   Android release APK，自签 keystore：优先 secrets（固定签名，可覆盖安装），
#           未配置则现场生成临时 keystore（每次签名不同，升级需卸载重装）
#   Linux   x86_64 ibus 引擎 tarball（install.sh 一键装）
#
# 固定 Android 签名（可选，一次性）：
#   keytool -genkeypair -v -keystore liana.keystore -alias liana \
#     -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Liana"
#   repo Settings → Secrets → Actions 配置：
#     LIANA_KEYSTORE_BASE64        = base64 -i liana.keystore | pbcopy
#     LIANA_RELEASE_STORE_PASSWORD = keystore 密码
#     LIANA_RELEASE_KEY_ALIAS      = liana
#     LIANA_RELEASE_KEY_PASSWORD   = key 密码
#
# 手动触发（workflow_dispatch）＝彩排：三端照常构建、只传 artifact，不发 Release。

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ────────────────────────── macOS ──────────────────────────
  macos:
    # macOS 26 SDK：源码用了 Liquid Glass API（NSGlassEffectView / Glass），
    # macos-15 及以下的 Xcode 编不过
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Universal Binary：两个架构的标准库都要在
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: 版本号写入 Info.plist（tag 触发时）
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" platforms/macos/Info.plist

      - name: 构建 + DMG（无证书自动降级 ad-hoc，跳过公证）
        run: platforms/macos/dist.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error

  # ────────────────────────── Android ──────────────────────────
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - uses: dtolnay/rust-toolchain@stable

      - name: 生成词典 base.ifd（资产未入库，构建前现生成）
        run: |
          mkdir -p platforms/android/app/src/main/assets
          cargo run --quiet -p xtask -- \
            dict build crates/dict/data/base-large.tsv \
            -o platforms/android/app/src/main/assets/base.ifd

      - name: versionName 对齐 tag（tag 触发时）
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/versionName = .*/versionName = \"$VERSION\"/" platforms/android/app/build.gradle.kts

      - name: 准备签名 keystore（优先 secrets，缺则临时生成）
        env:
          LIANA_KEYSTORE_BASE64: ${{ secrets.LIANA_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$LIANA_KEYSTORE_BASE64" ]]; then
            echo "$LIANA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/liana.keystore"
            [[ -s "$RUNNER_TEMP/liana.keystore" ]] || {
              echo "✗ LIANA_KEYSTORE_BASE64 解码为空——检查 secret 内容（macOS 编码请用 openssl base64）" >&2
              exit 1
            }
            echo "==> 使用 secrets 提供的固定 keystore（可覆盖安装升级）"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/liana.keystore" \
              -storepass liana-release -keypass liana-release -alias liana \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=Liana, OU=Liana, O=Liana, L=Local, ST=Local, C=CN" >/dev/null
            echo "==> ⚠ 未配置 LIANA_KEYSTORE_BASE64，本次为临时签名（升级需卸载重装；固定方法见 workflow 头注释）"
          fi

      - name: 构建签名 release APK
        working-directory: platforms/android
        env:
          LIANA_RELEASE_STORE_FILE: ${{ runner.temp }}/liana.keystore
          # 有 secrets 用真密码；无 secrets 回退临时 keystore 的密码（见上一步生成参数）
          LIANA_RELEASE_STORE_PASSWORD: ${{ secrets.LIANA_RELEASE_STORE_PASSWORD || 'liana-release' }}
          LIANA_RELEASE_KEY_ALIAS: ${{ secrets.LIANA_RELEASE_KEY_ALIAS || 'liana' }}
          LIANA_RELEASE_KEY_PASSWORD: ${{ secrets.LIANA_RELEASE_KEY_PASSWORD || 'liana-release' }}
        run: gradle assembleRelease --no-daemon

      - name: 归档命名 + 校验和
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp platforms/android/app/build/outputs/apk/release/app-release.apk \
             "dist/Liana-${VERSION}-android.apk"
          ( cd dist && sha256sum "Liana-${VERSION}-android.apk" \
              > "Liana-${VERSION}-android.apk.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  # ────────────────────────── Linux ──────────────────────────
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: 构建 + tarball
        env:
          LIANA_VERSION: ${{ github.ref_name }}
        run: platforms/linux/dist.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  # ────────────────────────── Windows ──────────────────────────
  # TSF 集成仍是骨架：DLL 能编出来，但 DllRegisterServer 还是 E_NOTIMPL、也没有导出表，
  # 所以这里只出「构建产物包」，不冒充可安装的输入法。等注册与候选窗补完再改成安装包。
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-tsf

      - name: 准备 MSVC 环境（cl.exe 与 Windows SDK）
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 诊断：SDK 里的 TSF 导入库与 IDL
        shell: cmd
        run: |
          echo SDK=%WindowsSdkDir% VER=%WindowsSDKLibVersion%
          dir /b "%WindowsSdkDir%Lib\%WindowsSDKLibVersion%um\x64\msctf*.lib" 2>nul || echo 没有 msctf*.lib
          dir /b "%WindowsSdkDir%Lib\%WindowsSDKLibVersion%um\x64\*tsf*" 2>nul || echo 没有 *tsf* 库
          dir /b "%WindowsSdkDir%Include\%WindowsSDKLibVersion%um\msctf.idl" 2>nul || echo 没有 msctf.idl
      - name: 构建 TSF DLL 与词典
        shell: cmd
        run: platforms\windows\build.cmd

      - name: 归档命名 + 校验和
        shell: pwsh
        run: |
          $raw = '${{ github.ref_name }}'
          $version = if ($raw -match '^v?\d+\.\d+\.\d+') { $raw -replace '^v', '' } else { '0.0.0-dev' }
          New-Item -ItemType Directory -Force dist | Out-Null
          $stage = "dist/liana-$version-windows-x64"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item platforms/windows/build/liana_tsf.dll $stage -ErrorAction Stop
          Copy-Item platforms/windows/build/base.ifd $stage -ErrorAction Stop
          Copy-Item platforms/windows/README.md $stage
          @'
          松萝 Liana · Windows 构建产物（骨架阶段）

          包含文件：
            liana_tsf.dll  TSF 文本服务 DLL（x64）
            base.ifd       基础词库（xtask 构建）
            README.md      Windows 端现状与后续步骤

          这个包还不能当输入法安装：textservice.cpp 的 DllRegisterServer 仍返回
          E_NOTIMPL，DLL 也还没有导出表，regsvr32 会失败。它只用于继续开发与联调。
          # ASCII 文件名：Zip 里带中文名在 Windows 资源管理器里会显示成乱码
          '@ | Set-Content -Path "$stage/BUILD-NOTES.txt" -Encoding UTF8
          $zip = "dist/liana-$version-windows-x64.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          Remove-Item $stage -Recurse -Force
          "$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower())  $(Split-Path $zip -Leaf)" |
            Set-Content "$zip.sha256" -Encoding ASCII
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  # ────────────────────────── 发 Release ──────────────────────────
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [macos, android, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: 组装 Release 说明（tag 说明 + 安装指引 + 校验和）
        run: |
          {
            git log -1 --format='%s'
            echo
            git log -1 --format='%b' | sed '/./,$!d'
            echo
            cat .github/release-notes-template.md
            cat release/*.sha256
            echo '```'
          } > notes.md

      - name: 创建 Release 并挂载产物
        env:
          GH_TOKEN: ${{ github.token }}
        # scripts/daily-release.sh 可能已在本机建好 Release 并挂上本地 DMG：
        # 此时只补传缺失的产物（Android / Linux），同名资产不覆盖
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            existing="$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name')"
            for f in release/*; do
              # download-artifact 会把目录也带下来（例如 Windows 的打包目录），只传文件
              [ -f "$f" ] || continue
              if grep -qxF "$(basename "$f")" <<<"$existing"; then
                echo "skip (already on release): $(basename "$f")"
              else
                gh release upload "$GITHUB_REF_NAME" "$f"
              fi
            done
          else
            TITLE="$(git log -1 --format='%s')"
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag --title "$TITLE" --notes-file notes.md \
              release/*
          fi
