[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/dict",
    "crates/pinyin",
    "crates/en",
    "crates/ja",
    "crates/emoji",
    "crates/symbol",
    "crates/sync",
    "crates/zhconv",
    "crates/engine",
    "crates/ai",
    "crates/plugin",
    "crates/ffi",
    "xtask",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
authors = ["Liana contributors"]
repository = "https://github.com/sevenaaaaaaaaa/liana"
description = "Privacy-first cross-platform input method: local engine, no server, LAN-only E2EE sync"

[workspace.dependencies]
liana-core = { path = "crates/core" }
liana-dict = { path = "crates/dict" }
liana-pinyin = { path = "crates/pinyin" }
liana-en = { path = "crates/en" }
liana-ja = { path = "crates/ja" }
liana-emoji = { path = "crates/emoji" }
liana-symbol = { path = "crates/symbol" }
liana-sync = { path = "crates/sync" }
liana-zhconv = { path = "crates/zhconv" }
liana-engine = { path = "crates/engine" }
liana-ai = { path = "crates/ai" }
liana-plugin = { path = "crates/plugin" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
